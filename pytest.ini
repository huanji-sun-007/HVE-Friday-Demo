[tool:pytest]
testpaths = app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Show extra test summary info
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

markers =
    asyncio: mark test as an async test
    integration: mark test as an integration test
    unit: mark test as a unit test
